name: Update activity overview

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/update_activity.py"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        run: python scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: senirualuthge
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/languages.svg
          git diff --cached --quiet || git commit -m "chore: refresh activity overview"
          git push
